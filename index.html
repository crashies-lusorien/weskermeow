$('mix').onclick=()=>{const p=P();if(sel.length<2)return $('lm').textContent='Pick two serums.';if(p.e<15)return $('lm').textContent='He is too tired for experiments.';p.e-=10;const k=[...sel].sort().join(''),good=k==='BR'||k==='GY',r=Math.random();sel=[];
 if(good){if(Math.random()<.3)unlockOut();S.pw=Math.min(100,S.pw+14);p.p=cl(p.p+10);ov={m:'proud',t:Date.now()+6e3};burst(42,20,30,['*','+','o'],GC);talk(pick(L.proud));$('lm').textContent='Success! Project W advances.';SFX.chime()}
 else if(r<.5){if(Math.random()<.12)unlockOut();S.pw=Math.min(100,S.pw+5);burst(42,20,30,['~','*','o'],['#ff5566','#ffd25a','#4ade80','#60a5fa','#c084fc']);talk('Side effect: rainbow tail. Intentional.');$('lm').textContent='Silly side effect. Small progress.';SFX.pop()}
 else{shk=1.2;p.c=cl(p.c-20);S.pw=Math.min(100,S.pw+1);burst(42,20,30,['#','%','.'],['#6b7280','#9ca3af','#ff9f43']);talk('Variables... accounted for.');$('lm').textContent='Boom. Smoke everywhere.';SFX.boom()}};
$('clone').onclick=()=>{S.tubes.push({st:1,t0:Date.now()});S.pw=0;talk('Perfection takes patience.');$('lm').textContent='Cloning started. It takes about 2 minutes.'};
function finish(tb){tb.st=2;const n='Wesker '+(S.pets.length+1);tb.n=n;S.pets.push(Object.assign(newPet(n,pick(['calm','chaotic','smug'])),{}));tabs();
 if(!S.ended){S.ended=true;scene='end';$('end').hidden=false;$('lab').hidden=true}}
$('cont').onclick=()=>{$('end').hidden=true;scene=labOn?'lab':'room';$('lab').hidden=!labOn;talk('A new subject. How delightful.')};
// ---- input
function cell(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*VC+CAMX,(e.clientY-r.top)/r.height*R]}
const onCat=(x,y)=>{const c=CAT();return x>=ox&&x<=ox+Math.floor(26*c.sx)&&y>=c.y&&y<=39};
cv.addEventListener('pointerdown',e=>{if(scene!=='room')return burst(...cell(e),14,HE,HC);const[x,y]=cell(e),p=P();if(note){note=null;return}if(labHit(x,y)){SFX.pop();return}
 if(onCat(x,y)){holdT=setTimeout(()=>{petting=1},450)}
 else if(x>=64&&y>=35&&y<=42)feed();
 else{const n=Date.now();if(n-lastTap<320){for(let i=0;i<14;i++)parts.push({x:rnd(4,80),y:0,vx:rnd(-1,1),vy:rnd(2,6),l:3.5,gr:3,ch:'o',col:'#c2814b'});p.p=cl(p.p+5);talk('Treats. Acceptable.')}else{toy={x:Math.max(2,Math.min(78,x)),y:Math.min(38,Math.max(30,y)),l:6};burst(x,y,8,['*','.'],PC)}lastTap=n}});
function up(e){clearTimeout(holdT);if(scene!=='room')return;const[x,y]=cell(e);if(petting){petting=0;return}if(onCat(x,y)&&e.type==='pointerup'){tapS++;squash=Date.now()+260;earF=Date.now()+420;lookO={x:Math.max(-1,Math.min(1,(x-(ox+CW()/2))/20)),t:Date.now()+1500};const m=mood();((m==='annoyed'||m==='furious')?SFX.hiss:SFX.meow)();burst(x,y,10,m==='annoyed'||m==='furious'?['!','*']:HE,m==='annoyed'||m==='furious'?['#ff5566','#fff']:HC);talk(pick(L[m]),2500);if(m==='furious')shk=.5}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointermove',e=>{lookX=Math.max(-1,Math.min(1,(cell(e)[0]-(ox+20))/20))});cv.addEventListener('pointerleave',()=>{clearTimeout(holdT);petting=0});
setInterval(()=>{tapS=Math.max(0,tapS-1)},2500);
// ---- console
function log(s){const l=$('log');l.textContent+=s+'\n';l.scrollTop=l.scrollHeight}
$('wm').addEventListener('pointerdown',()=>{const n=Date.now();wmTaps=wmTaps.filter(t=>n-t<3000);wmTaps.push(n);if(wmTaps.length>=5){wmTaps=[];const o=!$('con').hidden;$('con').hidden=o;if(!o){$('log').textContent=owner?'Owner console. /help\n':'Passphrase:\n';$('cin').type=owner?'text':'password';$('cin').focus()}}});
$('cin').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=$('cin').value.trim();$('cin').value='';if(!v)return;
 if(!owner){if(h53(v)===HASH){owner=true;$('cin').type='text';log('Access granted. Owner console unlocked. /help')}else{log('Access denied. Nice try.');setTimeout(()=>{$('con').hidden=true},900)}return}
 log('> '+v);try{run(v)}catch(x){log('Error: '+x.message)}});
function run(v){const[c,...a]=v.replace(/^\//,'').split(' '),r=a.join(' '),p=P(),n=+a[0];
 const H={help:()=>log('age <d> | outfit <labcoat|cape|visor|bow|none> | unlockall | agespeed <x> | time day|night|auto | stat hunger|happy|energy|clean <0-100> | mood <name> | shades on|off | godmode on|off | feed | pet | say <t> | burst hearts|confetti|paws | spawn mouse|treat | projectw <n> | unlock tube | clone | tubes | switch <n> | trait <t> | name <t> | cooldown | export | import <json> | reset | clear | exit'),
 age:()=>{p.ageMs=n*864e5;p.by=Math.floor(n);log('Age set to '+n+' days')},agespeed:()=>{S.mul=n||1;log('Age speed x'+S.mul)},
 time:()=>{S.nt=a[0]==='auto'?null:a[0];log('Time: '+(S.nt||'auto'))},
 stat:()=>{const k={hunger:'h',happy:'p',energy:'e',clean:'c'}[a[0]];if(!k)return log('Unknown stat');p[k]=cl(+a[1]);log(a[0]+' = '+p[k])},
 mood:()=>{if(!M[a[0]])return log('Moods: '+Object.keys(M).join(', '));ov={m:a[0],t:Date.now()+3e5};log('Mood locked 5 min: '+a[0])},
 shades:()=>{M.smug.s=a[0]!=='off'?1:0;log('Shades '+a[0]+' (smug)')},godmode:()=>{god=a[0]==='on';log('Godmode '+god)},
 feed:()=>feed(),pet:()=>{p.p=cl(p.p+20);burst(42,18,20,HE,HC)},say:()=>talk(r,6000),
 burst:()=>burst(42,20,40,a[0]==='confetti'?['*','o','~']:a[0]==='paws'?['*']:HE,a[0]==='confetti'?['#ff5566','#ffd25a','#60a5fa','#4ade80']:HC),
 spawn:()=>{if(a[0]==='treat')for(let i=0;i<14;i++)parts.push({x:rnd(4,80),y:0,vx:0,vy:4,l:3,gr:3,ch:'o',col:'#c2814b'});else toy={x:rnd(6,76),y:36,l:6}},
 projectw:()=>{S.pw=cl(n);log('Project W '+S.pw)},unlock:()=>{S.pw=100;log('Tube lab unlocked (Project W 100)')},
 clone:()=>{S.tubes.push({st:1,t0:Date.now()-12e4});log('Clone created')},
 tubes:()=>log(S.tubes.length?S.tubes.map((t,i)=>(i+1)+': '+(t.st===2?t.n:'growing')).join('\n'):'No tubes yet'),
 switch:()=>{if(S.pets[n-1]){S.cur=n-1;tabs();log('Now playing '+P().n)}else log('No such pet')},
 trait:()=>{p.tr=a[0];log('Trait: '+a[0])},name:()=>{p.n=r;tabs();log('Renamed')},cooldown:()=>{p.cd=0;log('Play cooldown cleared')},
 export:()=>log(JSON.stringify(S)),import:()=>{S=Object.assign(S,JSON.parse(r));tabs();log('Imported')},
 outfit:()=>{S.eq=a[0]==='none'?'':a[0];wd();log('Outfit: '+(S.eq||'none'))},unlockall:()=>{OUT.forEach(o=>{if(!S.outfits.includes(o))S.outfits.push(o)});wd();log('All outfits unlocked')},reset:()=>{try{localStorage.removeItem('wesker1')}catch(e){}location.reload()},clear:()=>{$('log').textContent=''},exit:()=>{$('con').hidden=true}};
 (H[c]||(()=>log('Unknown command. /help')))()}

// ---- sound
let AC=null;
function au(){if(!S.snd)return null;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function tone(f,d,ty,v,f2){const a=au();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start();o.stop(n+d)}catch(e){}}
const SFX={meow:()=>{tone(520,.35,'triangle',.06,800);setTimeout(()=>tone(800,.3,'triangle',.05,420),180)},purr:()=>tone(55,.25,'sawtooth',.03),pop:()=>tone(rnd(300,700),.08,'sine',.04),chime:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.4,'sine',.05),i*120)),boom:()=>tone(120,.5,'sawtooth',.07,30),hiss:()=>tone(2000,.3,'square',.015,500),bub:()=>tone(rnd(200,400),.1,'sine',.025,rnd(500,900))};
$('bS').onclick=()=>{S.snd=S.snd?0:1;$('bS').textContent='Sound: '+(S.snd?'on':'off')};
function CAT(){const k=ageD(P())<3;return{sx:k?1:1.25,y:k?23:18,kit:k}}
function CW(){return Math.floor(26*CAT().sx)}
function awayLine(s){if(s<120)return'You are late.';const h=s/3600,p=P(),t=h<1?Math.round(s/60)+' minutes':h<48?h.toFixed(1)+' hours':Math.floor(h/24)+' days';return p.h<40?'You were gone '+t+'. I was hungry for most of it.':p.c<40?'You were gone '+t+'. The lab got messy. I blame you.':'You were gone '+t+'. I kept the lab running. Obviously.'}
const LORE=[{at:15,t:'LOG 021: The first stable serum. The subject licked the beaker clean. Nobody authorized that.'},{at:30,t:'LOG 033: He now corrects our spelling on the whiteboard. He is right every time. Unsettling.'},{at:45,t:'LOG 047: Subject W escaped the box. He says it was always unlocked.'},{at:60,t:'LOG 058: Bloodwork is normal. His fur glows faintly under UV. We have stopped asking.'},{at:75,t:'LOG 071: He talks to the terminal now. The terminal talks back. We did not install that.'},{at:90,t:'LOG 088: Project W is nearly complete. The tubes hum at night. He sits in front of them. Smiling.'},{at:100,t:'FINAL LOG: Everything proceeded as planned.'}];
const OUT=['labcoat','cape','visor','bow'],OUTN={labcoat:'Lab coat',cape:'Red cape',visor:'Cyber visor',bow:'Bow tie'};
function wd(){const o=S.outfits.filter(x=>OUTN[x]);$('wd').innerHTML=o.length?'<span>Outfit:</span><button data-o="">None</button>'+o.map(x=>'<button data-o="'+x+'" class="'+(S.eq===x?'on':'')+'">'+OUTN[x]+'</button>').join(''):''}
$('wd').onclick=e=>{const o=e.target.dataset.o;if(o!==undefined){S.eq=o;wd()}};
function unlockOut(){const f=OUT.filter(o=>!S.outfits.includes(o));if(!f.length)return;const o=pick(f);S.outfits.push(o);S.eq=S.eq||o;wd();note={s:'NEW OUTFIT UNLOCKED: '+OUTN[o]+'. Equip it in the Lab.',t:Date.now()+7e3};SFX.chime()}
const HIST=[],PERSONA="You are Wesker, a smug cat who believes he is an advanced evolution of life: calm, brilliant, dramatic, dryly funny, a little menacing, secretly fond of his owner. You live in a lab and run Project W, which clones you. Never break character. Reply in under 40 words. No markdown, no emojis. Signature lines you may use: 'Seven minutes. Seven minutes is all I can spare to play with you.' and 'Yet here I am, spending my precious time, and you spend it by running away.'";
const SEV=['Seven minutes. Seven minutes is all I can spare to play with you.','Yet here I am, spending my precious time, and you spend it by running away.'];
const LR=[[/hello|\bhi\b|hey/i,['You are late. Naturally, I forgive you.','Greetings. I was only observing.']],[/who|name/i,['I am Wesker. The next step in feline evolution.','Wesker. Remember it. History will.']],[/evol/i,['Evolution is not waiting. I have simply gone ahead.','Nature is slow. I am not.']],[/hungry|food|eat|tuna/i,['Food. Yes. A necessary step in my plan.','Tuna is the correct answer to most questions.']],[/play|game|toy/i,[SEV[0],SEV[1]]],[/lab|project|experiment|clone|tube/i,['Project W proceeds. Do not touch the green one.','Perfection takes patience. And serum.']],[/love|like|friend|cute/i,['...You are tolerable. Do not repeat that.','Sentiment is inefficient. I am keeping it anyway.']],[/sad|bored|lonely/i,['Then sit. I will not say I am glad you are here.','Even evolution has quiet days. Stay.']],[/thank/i,['Gratitude noted. Filed under: inevitable.']]];
const LD=['Interesting. Continue.','I have considered your words. They were adequate.','Everything is proceeding as planned.','You speak. I evolve. We both make progress.','Ask me something worthy.'];
function local(q){for(const[r,a]of LR)if(r.test(q))return pick(a);return pick(LD)}
function addMsg(w,t){const p=document.createElement('p'),b=document.createElement('b');b.textContent=w+': ';if(w==='Wesker')b.className='wn';p.appendChild(b);p.appendChild(document.createTextNode(t));$('cl').appendChild(p);$('cl').scrollTop=$('cl').scrollHeight}
async function ask(q){addMsg('You',q);HIST.push('Owner: '+q);let a='';
 try{const c=window.claude,sm=c&&c.use?await c.use('sample'):null;if(sm){const r=await sm(PERSONA+'\nConversation so far:\n'+HIST.slice(-6).join('\n')+'\nMood: '+mood()+'. Age: '+ageD(P()).toFixed(1)+' days.\nReply as Wesker only, one short reply.',{cache:false,modelTier:'quick'});a=(r.text||'').trim().slice(0,300)}}catch(e){}
 if(!a)a=local(q);HIST.push('Wesker: '+a);addMsg('Wesker',a);talk(a,7000);SFX.meow()}
$('bT').onclick=()=>{$('chat').hidden=!$('chat').hidden;if(!$('chat').hidden){$('ci').focus();if(!$('cl').childElementCount)addMsg('Wesker','You may speak. I am listening. Barely.')}};
const sendC=()=>{const v=$('ci').value.trim();$('ci').value='';if(v)ask(v)};
$('cs').onclick=sendC;$('ci').addEventListener('keydown',e=>{if(e.key==='Enter')sendC()});
$('bB').onclick=()=>{$('bk').hidden=!$('bk').hidden;if(!$('bk').hidden){$('bt').value=JSON.stringify(S);$('bt').select();try{navigator.clipboard.writeText($('bt').value)}catch(e){}}};
$('bl').onclick=()=>{try{S=Object.assign(S,JSON.parse($('bt').value));tabs();wd();$('bk').hidden=true;talk('Save restored. Continuity preserved.')}catch(e){$('bt').value='Could not read that save.'}};
function phrase(){talk(SEV[0],3400);ov={m:'annoyed',t:Date.now()+8e3};SFX.hiss();setTimeout(()=>talk(SEV[1],4600),3500)}
function save(){try{S.last=Date.now();localStorage.setItem('wesker1',JSON.stringify(S))}catch(e){}}
setInterval(save,5000);addEventListener('beforeunload',save);
let away=(Date.now()-S.last)/1e3;{const dt=Math.min(away,7200);if(dt>5)tick(dt)}
addEventListener('resize',size);size();tabs();wd();$('bS').textContent='Sound: '+(S.snd?'on':'off');talk(awayLine(away),6000);nextIdle=Date.now()+9e3;requestAnimationFrame(draw);
</script></body></html>
